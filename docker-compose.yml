version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ridenow-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ridenow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/20261030_init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ridenow-net

  # 2. RideNow Backend API & Socket.IO
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ridenow-backend
    restart: always
    environment:
      PORT: 5050
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/ridenow?schema=public
      JWT_SECRET: ridenow_super_secret_jwt_key_2026_india
      RAZORPAY_KEY_ID: rzp_test_ridenow_demo_key
      RAZORPAY_KEY_SECRET: rzp_secret_demo_token
      GOOGLE_MAPS_API_KEY: DEMO_MAPS_KEY_INDIA
    ports:
      - "5050:5050"
    depends_on:
      - postgres
    networks:
      - ridenow-net

  # 3. RideNow Frontend (Vite / Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ridenow-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - ridenow-net

networks:
  ridenow-net:
    driver: bridge

volumes:
  pgdata:
    driver: local

